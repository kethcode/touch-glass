<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Touch Glass</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --blue: #58a6ff; --green: #3fb950; --purple: #bc8cff; --orange: #d29922; --red: #f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  header h1 { font-size: 20px; color: var(--blue); }
  .header-btns { display: flex; gap: 8px; }
  .btn-sm { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn-sm:hover { border-color: var(--blue); color: var(--blue); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--card); padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
  .stat .num { font-size: 1.4em; font-weight: bold; color: var(--blue); }
  .stat .label { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .tabs { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 16px; cursor: pointer; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .search-bar { position: relative; margin-bottom: 12px; display: none; }
  .search-bar.show { display: block; }
  .search-bar input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
  .search-bar input:focus { border-color: var(--blue); }

  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 4px 12px; border-radius: 16px; cursor: pointer; font-size: 12px; }
  .pill:hover, .pill.active { border-color: var(--blue); color: var(--blue); background: rgba(88,166,255,0.08); }

  .feed { min-height: 200px; }
  .item { background: var(--card); padding: 14px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; }
  .item:hover { border-color: #444; }
  .item .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .item .author { color: var(--blue); font-weight: 600; font-size: 13px; text-decoration: none; }
  .item .author:hover { text-decoration: underline; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; }
  .badge.timeline { background: rgba(88,166,255,0.12); color: var(--blue); }
  .badge.bookmarks { background: rgba(210,153,34,0.12); color: var(--orange); }
  .badge.own { background: rgba(63,185,80,0.12); color: var(--green); }
  .badge.linkedin_feed, .badge.linkedin_bookmarks { background: rgba(188,140,255,0.12); color: var(--purple); }
  .badge.link { background: rgba(63,185,80,0.12); color: var(--green); }
  .badge.contact { background: rgba(188,140,255,0.12); color: var(--purple); }
  .badge.follower, .badge.following, .badge.mutual { background: rgba(188,140,255,0.12); color: var(--purple); }

  .item .text { line-height: 1.45; font-size: 13px; margin-bottom: 6px; word-break: break-word; }
  .item .meta { color: var(--muted); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
  .item .meta a { color: var(--blue); text-decoration: none; font-size: 11px; }

  .load-more { text-align: center; padding: 16px; }
  .load-more button { background: var(--card); border: 1px solid var(--border); color: var(--blue); padding: 8px 24px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .empty { text-align: center; padding: 40px; color: var(--muted); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .container { padding: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Touch Glass</h1>
    <div class="header-btns">
      <button class="btn-sm" onclick="showConfig()">Settings</button>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat"><div class="num" id="s-tweets">-</div><div class="label">Posts</div></div>
    <div class="stat"><div class="num" id="s-links">-</div><div class="label">Links</div></div>
    <div class="stat"><div class="num" id="s-contacts">-</div><div class="label">People</div></div>
    <div class="stat"><div class="num" id="s-pending">-</div><div class="label">Pending</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="timeline" onclick="switchView(this)">Timeline</div>
    <div class="tab" data-view="search" onclick="switchView(this)">Search</div>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" id="q" placeholder="Search posts, links, people..." autofocus>
  </div>

  <div class="filters">
    <span class="pill active" data-source="all" onclick="setSource(this)">All</span>
    <span class="pill" data-source="timeline" onclick="setSource(this)">Timeline</span>
    <span class="pill" data-source="bookmarks" onclick="setSource(this)">Bookmarks</span>
    <span class="pill" data-source="own" onclick="setSource(this)">Own</span>
    <span class="pill" data-source="linkedin_feed" onclick="setSource(this)">LinkedIn</span>
  </div>

  <div class="feed" id="feed"></div>
  <div class="load-more" id="loadMore" style="display:none"><button onclick="loadMore()">Load more</button></div>
</div>

<div id="configModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:340px;max-width:90vw;">
    <h3 style="color:var(--blue);margin-bottom:16px;">Settings</h3>
    <label style="color:var(--muted);font-size:12px;">API URL</label>
    <input type="text" id="apiUrl" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:10px;font-size:14px;">
    <label style="color:var(--muted);font-size:12px;">Password</label>
    <input type="password" id="apiKey" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:12px;font-size:14px;">
    <div style="display:flex;gap:8px;">
      <button onclick="saveConfig()" style="flex:1;padding:8px;border-radius:6px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:13px;">Save</button>
      <button onclick="localStorage.clear();location.reload()" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;">Logout</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_API = '';
let API_URL = localStorage.getItem('brain_api_url') || DEFAULT_API;
let API_KEY = localStorage.getItem('brain_api_key') || new URLSearchParams(location.search).get('key') || '';
if (API_KEY) { localStorage.setItem('brain_api_key', API_KEY); document.cookie = 'brain_key=' + API_KEY + ';path=/;max-age=31536000'; }
let currentSource = 'all';
let currentView = 'timeline';
let timelineOffset = 0;
let searchTimeout;

if (!API_KEY) {
  API_KEY = prompt('Enter password:') || '';
  if (API_KEY) { localStorage.setItem('brain_api_key', API_KEY); document.cookie = 'brain_key=' + API_KEY + ';path=/;max-age=31536000'; }
}

const H = {'x-brain-key': API_KEY, 'bypass-tunnel-reminder': 'true'};

document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(e.target.value), 350);
});
document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(searchTimeout); doSearch(e.target.value); }
});

function switchView(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentView = el.dataset.view;
  document.getElementById('searchBar').classList.toggle('show', currentView === 'search');
  if (currentView === 'timeline') { timelineOffset = 0; loadTimeline(); }
  else { document.getElementById('feed').innerHTML = '<div class="empty">Type to search</div>'; document.getElementById('q').focus(); }
}

function setSource(el) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  currentSource = el.dataset.source;
  if (currentView === 'timeline') { timelineOffset = 0; loadTimeline(); }
  else { const q = document.getElementById('q').value; if (q) doSearch(q); }
}

async function loadTimeline(append) {
  if (!append) { document.getElementById('feed').innerHTML = '<div class="empty">Loading...</div>'; timelineOffset = 0; }
  try {
    let url = `${API_URL}/timeline?limit=50&offset=${timelineOffset}`;
    if (currentSource !== 'all') url += `&source=${currentSource}`;
    const res = await fetch(url, {headers: H});
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    const html = data.items.map(renderItem).join('');
    if (append) document.getElementById('feed').innerHTML += html;
    else document.getElementById('feed').innerHTML = html || '<div class="empty">No items yet</div>';
    document.getElementById('loadMore').style.display = data.items.length >= 50 ? '' : 'none';
    timelineOffset += data.items.length;
  } catch(e) {
    if (!append) document.getElementById('feed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function loadMore() { loadTimeline(true); }

async function doSearch(q) {
  if (!q || q.length < 2) {
    document.getElementById('feed').innerHTML = '<div class="empty">Type to search</div>';
    return;
  }
  document.getElementById('feed').innerHTML = '<div class="empty">Searching...</div>';
  try {
    let url = `${API_URL}/search?q=${encodeURIComponent(q)}&limit=100`;
    if (currentSource !== 'all') url += `&source=${currentSource}`;
    const res = await fetch(url, {headers: H});
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    const html = data.results.map(renderItem).join('');
    document.getElementById('feed').innerHTML = html || '<div class="empty">No results</div>';
    document.getElementById('loadMore').style.display = 'none';
  } catch(e) {
    document.getElementById('feed').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderItem(r) {
  const type = r.type || 'tweet';
  const src = r.source || type;

  if (type === 'contact') {
    return `<div class="item">
      <div class="top">
        <a class="author" href="https://x.com/${esc(r.username||r.author_username||'')}" target="_blank">@${esc(r.username||r.author_username||'')}</a>
        <span class="badge ${esc(r.relationship||src)}">${esc(r.relationship||'contact')}</span>
      </div>
      ${r.display_name ? `<div class="text" style="font-weight:600;margin-bottom:2px;">${esc(r.display_name)}</div>` : ''}
      <div class="text">${esc(r.bio||r.text||'')}</div>
      <div class="meta">
        ${r.followers_count ? `<span>${fmt(r.followers_count)} followers</span>` : ''}
        ${r.platform ? `<span>${r.platform}</span>` : ''}
      </div>
    </div>`;
  }

  if (type === 'link') {
    return `<div class="item">
      <div class="top">
        <a class="author" href="${r.url}" target="_blank">${esc(r.title||r.display_name||r.url||'').slice(0,80)}</a>
        <span class="badge link">${esc(r.domain||'link')}</span>
      </div>
      <div class="text">${esc(r.description||r.text||'').slice(0,200)}</div>
      <div class="meta">
        ${r.fetch_status ? `<span>${r.fetch_status}</span>` : ''}
        <a href="${r.url}" target="_blank">${(r.url||'').slice(0,50)}</a>
      </div>
    </div>`;
  }

  // Tweet / post
  const authorUrl = r.platform === 'linkedin' ? '#' : `https://x.com/${esc(r.author_username||'')}`;
  return `<div class="item">
    <div class="top">
      <a class="author" href="${authorUrl}" target="_blank">@${esc(r.author_username||r.author_display_name||'?')}</a>
      <span class="badge ${esc(src)}">${esc(src)}</span>
    </div>
    <div class="text">${esc(r.text||'')}</div>
    <div class="meta">
      ${r.likes ? `<span>&hearts; ${fmt(r.likes)}</span>` : ''}
      ${r.retweets ? `<span>&#8634; ${fmt(r.retweets)}</span>` : ''}
      ${r.views ? `<span>&#128065; ${fmt(r.views)}</span>` : ''}
      ${r.url ? `<a href="${r.url}" target="_blank">View</a>` : ''}
      ${r.created_at ? `<span>${timeAgo(r.created_at)}</span>` : ''}
    </div>
  </div>`;
}

function fmt(n) { if (!n) return '0'; n = parseInt(n); if (n >= 1e6) return (n/1e6).toFixed(1)+'M'; if (n >= 1e3) return (n/1e3).toFixed(1)+'K'; return n.toString(); }
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(d) {
  if (!d) return '';
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  if (s < 604800) return Math.floor(s/86400) + 'd';
  return new Date(d).toLocaleDateString();
}

async function loadStats() {
  try {
    const res = await fetch(`${API_URL}/stats`, {headers: H});
    if (!res.ok) return;
    const s = await res.json();
    document.getElementById('s-tweets').textContent = fmt(s.tweets);
    document.getElementById('s-links').textContent = fmt(s.links);
    document.getElementById('s-contacts').textContent = fmt(s.contacts);
    document.getElementById('s-pending').textContent = fmt(s.pending_links);
  } catch(e) {}
}

loadStats();
setInterval(loadStats, 30000);
loadTimeline();

function showConfig() {
  document.getElementById('apiUrl').value = API_URL;
  document.getElementById('apiKey').value = API_KEY;
  document.getElementById('configModal').style.display = 'flex';
}
function saveConfig() {
  API_URL = document.getElementById('apiUrl').value || DEFAULT_API;
  API_KEY = document.getElementById('apiKey').value || '';
  localStorage.setItem('brain_api_url', API_URL);
  localStorage.setItem('brain_api_key', API_KEY);
  document.cookie = 'brain_key=' + API_KEY + ';path=/;max-age=31536000';
  document.getElementById('configModal').style.display = 'none';
  loadStats(); loadTimeline();
}
document.getElementById('configModal').addEventListener('click', (e) => {
  if (e.target.id === 'configModal') document.getElementById('configModal').style.display = 'none';
});
</script>
</body>
</html>
